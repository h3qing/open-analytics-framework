name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          # CODE_OF_CONDUCT.md is verbatim upstream Contributor Covenant text
          globs: |
            **/*.md
            !CODE_OF_CONDUCT.md

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Links inside the repo must resolve. A broken relative path is rot we
      # introduced, and it fails the build.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --offline "**/*.md"
          fail: true
      # External links are reported but do not gate a merge. Publishers block
      # or throttle CI runners, so a refusal here says nothing about whether a
      # citation is still good, and every one was opened and verified by hand
      # before it entered REFERENCES.md. Read the report when it flags
      # something, then check the URL yourself.
      - name: Report external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml "**/*.md"
          fail: false

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Sources & Stories sections and citation keys
        run: python3 .github/scripts/check_provenance.py
