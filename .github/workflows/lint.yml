name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          # CODE_OF_CONDUCT.md is verbatim upstream Contributor Covenant text
          globs: |
            **/*.md
            !CODE_OF_CONDUCT.md

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --accept "100..=103,200..=299,403,429" --exclude-path CANDIDATE_PATTERNS.md "**/*.md"
          fail: true

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Sources & Stories sections and citation keys
        run: python3 .github/scripts/check_provenance.py
