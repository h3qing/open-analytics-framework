<text x="602" y="144" font-size="10.5" fill="#8b8b8b">Signed up June</text>
<text x="576" y="178" font-size="10.5" fill="#8b8b8b">Newer groups have shorter</text>
<text x="576" y="193" font-size="10.5" fill="#8b8b8b">lines: they have simply had</text>
<text x="576" y="208" font-size="10.5" fill="#8b8b8b">less time. Read down a line</text>
<text x="576" y="223" font-size="10.5" fill="#8b8b8b">for where that group settles,</text>
<text x="576" y="238" font-size="10.5" fill="#8b8b8b">and across lines to compare</text>
<text x="576" y="253" font-size="10.5" fill="#8b8b8b">one month's signups with</text>
<text x="576" y="268" font-size="10.5" fill="#8b8b8b">another month's at the</text>
<text x="576" y="283" font-size="10.5" fill="#8b8b8b">same age.</text>
<text x="64" y="440" font-size="11.5" fill="#8b8b8b">Illustrative numbers, chosen only to show the shape. Read the levels off your own cohorts, never off this chart.</text>
