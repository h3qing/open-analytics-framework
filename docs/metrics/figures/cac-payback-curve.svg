<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" width="760" height="472" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<text x="64" y="20" font-size="13.5" font-weight="600" fill="#8b8b8b">Cumulative discounted margin per customer acquired, against two acquisition prices</text>
<line x1="64.0" y1="378.0" x2="556.0" y2="378.0" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="382.0" font-size="11" fill="#8b8b8b" text-anchor="end">$0</text>
<line x1="64.0" y1="310.4" x2="556.0" y2="310.4" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="314.4" font-size="11" fill="#8b8b8b" text-anchor="end">$50</text>
<line x1="64.0" y1="242.8" x2="556.0" y2="242.8" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="246.8" font-size="11" fill="#8b8b8b" text-anchor="end">$100</text>
<line x1="64.0" y1="175.2" x2="556.0" y2="175.2" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="179.2" font-size="11" fill="#8b8b8b" text-anchor="end">$150</text>
<line x1="64.0" y1="107.6" x2="556.0" y2="107.6" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="111.6" font-size="11" fill="#8b8b8b" text-anchor="end">$200</text>
<line x1="64.0" y1="40.0" x2="556.0" y2="40.0" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="44.0" font-size="11" fill="#8b8b8b" text-anchor="end">$250</text>
<text x="64.0" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">1</text>
<text x="128.2" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">4</text>
<text x="192.3" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">7</text>
<text x="256.5" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">10</text>
<text x="320.7" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">13</text>
<text x="384.9" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">16</text>
<text x="449.0" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">19</text>
<text x="513.2" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">22</text>
<line x1="64.0" y1="378.0" x2="556.0" y2="378.0" stroke="#8b8b8b" stroke-opacity="0.5"/>
<text x="310" y="416" font-size="11.5" fill="#8b8b8b" text-anchor="middle">Months since the customer was acquired</text>
<text x="17" y="209" font-size="11.5" fill="#8b8b8b" text-anchor="middle" transform="rotate(-90 17 209)">Cumulative discounted margin</text>
<line x1="64.0" y1="80.6" x2="556.0" y2="80.6" stroke="#c2683a" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="70.0" y="74.6" font-size="11" fill="#c2683a">CAC $220</text>
<line x1="64.0" y1="256.3" x2="556.0" y2="256.3" stroke="#c2683a" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="70.0" y="250.3" font-size="11" fill="#c2683a">CAC $90</text>
<path d="M64.0,351.0 L85.4,327.4 L106.8,306.3 L128.2,287.3 L149.6,269.9 L171.0,253.8 L192.3,238.7 L213.7,224.5 L235.1,211.0 L256.5,198.2 L277.9,185.9 L299.3,174.1 L320.7,162.8 L342.1,151.8 L363.5,141.2 L384.9,131.0 L406.3,121.0 L427.7,111.4 L449.0,102.0 L470.4,92.8 L491.8,83.9 L513.2,75.2 L534.6,66.8 L556.0,58.5" fill="none" stroke="#3a7ca5" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="171.0" y1="253.8" x2="171.0" y2="378.0" stroke="#3a7ca5" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="3 3"/>
<circle cx="171.0" cy="253.8" r="4" fill="#3a7ca5"/>
<text x="178.0" y="271.8" font-size="11" fill="#3a7ca5">paid back, month 6</text>
<line x1="513.2" y1="75.2" x2="513.2" y2="378.0" stroke="#3a7ca5" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="3 3"/>
<circle cx="513.2" cy="75.2" r="4" fill="#3a7ca5"/>
<text x="506.2" y="93.2" font-size="11" fill="#3a7ca5" text-anchor="end">paid back, month 22</text>
<text x="576" y="60" font-size="10.5" font-weight="600" fill="#8b8b8b">One cohort, one curve,</text>
<text x="576" y="75" font-size="10.5" font-weight="600" fill="#8b8b8b">two prices.</text>
<text x="576" y="90" font-size="10.5" fill="#8b8b8b"></text>
<text x="576" y="105" font-size="10.5" fill="#8b8b8b">Every dollar is contribution</text>
<text x="576" y="120" font-size="10.5" fill="#8b8b8b">margin, discounted at 10</text>
<text x="576" y="135" font-size="10.5" fill="#8b8b8b">percent a year.</text>
<text x="576" y="150" font-size="10.5" fill="#8b8b8b"></text>
<text x="576" y="165" font-size="10.5" fill="#8b8b8b">At $90 the money is back in</text>
<text x="576" y="180" font-size="10.5" fill="#8b8b8b">half a year. At $220 the same</text>
<text x="576" y="195" font-size="10.5" fill="#8b8b8b">customer is a 22-month loan</text>
<text x="576" y="210" font-size="10.5" fill="#8b8b8b">the company has to fund.</text>
<text x="576" y="225" font-size="10.5" fill="#8b8b8b"></text>
<text x="576" y="240" font-size="10.5" fill="#8b8b8b">Both prices are well below</text>
<text x="576" y="255" font-size="10.5" fill="#8b8b8b">what this customer is worth</text>
<text x="576" y="270" font-size="10.5" fill="#8b8b8b">over the full relationship.</text>
<text x="576" y="285" font-size="10.5" fill="#8b8b8b">The curve is still climbing</text>
<text x="576" y="300" font-size="10.5" fill="#8b8b8b">at the edge of the chart:</text>
<text x="576" y="315" font-size="10.5" fill="#8b8b8b">about half the discounted</text>
<text x="576" y="330" font-size="10.5" fill="#8b8b8b">value sits past month 24,</text>
<text x="576" y="345" font-size="10.5" fill="#8b8b8b">where no data exists yet.</text>
<text x="64" y="440" font-size="11.5" fill="#8b8b8b">Illustrative numbers. Monthly retention starts at 88 percent and drifts up as the fragile customers leave first, so the</text>
<text x="64" y="456" font-size="11.5" fill="#8b8b8b">curve flattens; margin is $20 a month per surviving customer. The payback month is where the curve crosses the price.</text>
</svg>
