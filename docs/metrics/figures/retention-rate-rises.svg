<text x="55" y="314.4" font-size="11" fill="#8b8b8b" text-anchor="end">20%</text>
<line x1="64" y1="242.8" x2="556" y2="242.8" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="246.8" font-size="11" fill="#8b8b8b" text-anchor="end">40%</text>
<line x1="64" y1="175.2" x2="556" y2="175.2" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="179.2" font-size="11" fill="#8b8b8b" text-anchor="end">60%</text>
<line x1="64" y1="107.6" x2="556" y2="107.6" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="111.6" font-size="11" fill="#8b8b8b" text-anchor="end">80%</text>
<line x1="64" y1="40.0" x2="556" y2="40.0" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="44.0" font-size="11" fill="#8b8b8b" text-anchor="end">100%</text>
<text x="64.0" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">0-1</text>
<text x="108.7" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">1-2</text>
<text x="153.5" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">2-3</text>
<text x="198.2" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">3-4</text>
<text x="242.9" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">4-5</text>
<text x="287.6" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">5-6</text>
<text x="332.4" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">6-7</text>
<text x="377.1" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">7-8</text>
<text x="421.8" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">8-9</text>
<text x="466.5" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">9-10</text>
<text x="511.3" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">10-11</text>
<text x="556.0" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">11-12</text>
<line x1="64" y1="378" x2="556" y2="378" stroke="#8b8b8b" stroke-opacity="0.5"/>
<text x="310" y="416" font-size="11.5" fill="#8b8b8b" text-anchor="middle">Year over year</text>
<text x="17" y="209" font-size="11.5" fill="#8b8b8b" text-anchor="middle" transform="rotate(-90 17 209)">Retention rate that year</text>
<path d="M64.0,84.3 L108.7,89.0 L153.5,80.9 L198.2,71.1 L242.9,63.9 L287.6,60.9 L332.4,57.0 L377.1,55.8 L421.8,56.6 L466.5,53.7 L511.3,54.2 L556.0,52.4" fill="none" stroke="#3a7ca5" stroke-width="2.1" stroke-linejoin="round"/>
<circle cx="556.0" cy="52.4" r="3.2" fill="#3a7ca5"/>
<path d="M64.0,164.7 L108.7,127.3 L153.5,102.1 L198.2,89.5 L242.9,78.4 L287.6,71.6 L332.4,67.1 L377.1,65.2 L421.8,64.3 L466.5,61.2 L511.3,59.2 L556.0,58.5" fill="none" stroke="#2f6f4e" stroke-width="2.1" stroke-linejoin="round"/>
<circle cx="556.0" cy="58.5" r="3.2" fill="#2f6f4e"/>
<line x1="576" y1="60" x2="596" y2="60" stroke="#3a7ca5" stroke-width="2.1"/>
<text x="602" y="64" font-size="10.5" fill="#8b8b8b">High End cohort</text>
<line x1="576" y1="80" x2="596" y2="80" stroke="#2f6f4e" stroke-width="2.1"/>
<text x="602" y="84" font-size="10.5" fill="#8b8b8b">Regular cohort</text>
<text x="576" y="124" font-size="10.5" fill="#8b8b8b">The Regular cohort's</text>
<text x="576" y="139" font-size="10.5" fill="#8b8b8b">retention rate climbs from</text>
<text x="576" y="154" font-size="10.5" fill="#8b8b8b">63 percent to 95 percent.</text>
<text x="576" y="169" font-size="10.5" fill="#8b8b8b">Nobody in it became more</text>
<text x="576" y="184" font-size="10.5" fill="#8b8b8b">loyal. The people who were</text>
<text x="576" y="199" font-size="10.5" fill="#8b8b8b">going to leave have already</text>
<text x="576" y="214" font-size="10.5" fill="#8b8b8b">left, so the survivors are a</text>
<text x="576" y="229" font-size="10.5" fill="#8b8b8b">different mix of customers</text>
<text x="576" y="244" font-size="10.5" fill="#8b8b8b">from the ones you started</text>
<text x="576" y="259" font-size="10.5" fill="#8b8b8b">the cohort with.</text>
<text x="64" y="440" font-size="11.5" fill="#8b8b8b">Each point is one year divided by the year before it, taken straight off the previous figure. Nothing else was assumed.</text>
</svg>
