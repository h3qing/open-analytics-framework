<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" width="760" height="472" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<text x="64" y="20" font-size="13.5" font-weight="600" fill="#8b8b8b">Retention rate each period: two kinds of customer, and the one cohort they make up</text>
<line x1="64" y1="378.0" x2="556" y2="378.0" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="382.0" font-size="11" fill="#8b8b8b" text-anchor="end">0%</text>
<line x1="64" y1="310.4" x2="556" y2="310.4" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="314.4" font-size="11" fill="#8b8b8b" text-anchor="end">20%</text>
<line x1="64" y1="242.8" x2="556" y2="242.8" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="246.8" font-size="11" fill="#8b8b8b" text-anchor="end">40%</text>
<line x1="64" y1="175.2" x2="556" y2="175.2" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="179.2" font-size="11" fill="#8b8b8b" text-anchor="end">60%</text>
<line x1="64" y1="107.6" x2="556" y2="107.6" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="111.6" font-size="11" fill="#8b8b8b" text-anchor="end">80%</text>
<line x1="64" y1="40.0" x2="556" y2="40.0" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="44.0" font-size="11" fill="#8b8b8b" text-anchor="end">100%</text>
<text x="64.0" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">1</text>
<text x="134.3" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">2</text>
<text x="204.6" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">3</text>
<text x="274.9" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">4</text>
<text x="345.1" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">5</text>
<text x="415.4" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">6</text>
<text x="485.7" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">7</text>
<text x="556.0" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">8</text>
<line x1="64" y1="378" x2="556" y2="378" stroke="#8b8b8b" stroke-opacity="0.5"/>
<text x="310" y="416" font-size="11.5" fill="#8b8b8b" text-anchor="middle">Period</text>
<text x="17" y="209" font-size="11.5" fill="#8b8b8b" text-anchor="middle" transform="rotate(-90 17 209)">Retention rate that period</text>
<path d="M64.0,73.8 L134.3,73.8 L204.6,73.8 L274.9,73.8 L345.1,73.8 L415.4,73.8 L485.7,73.8 L556.0,73.8" fill="none" stroke="#3a7ca5" stroke-width="2.1" stroke-linejoin="round"/>
<circle cx="556.0" cy="73.8" r="3.2" fill="#3a7ca5"/>
<path d="M64.0,209.0 L134.3,209.0 L204.6,209.0 L274.9,209.0 L345.1,209.0 L415.4,209.0 L485.7,209.0 L556.0,209.0" fill="none" stroke="#c2683a" stroke-width="2.1" stroke-linejoin="round"/>
<circle cx="556.0" cy="209.0" r="3.2" fill="#c2683a"/>
<path d="M64.0,164.0 L134.3,145.1 L204.6,125.5 L274.9,108.3 L345.1,95.4 L415.4,86.6 L485.7,81.2 L556.0,78.2" fill="none" stroke="#2f6f4e" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="556.0" cy="78.2" r="3.2" fill="#2f6f4e"/>
<line x1="576" y1="60" x2="596" y2="60" stroke="#3a7ca5" stroke-width="2.1"/>
<text x="602" y="64" font-size="10.5" fill="#8b8b8b">Sticky third: 90% every period</text>
<line x1="576" y1="80" x2="596" y2="80" stroke="#c2683a" stroke-width="2.1"/>
<text x="602" y="84" font-size="10.5" fill="#8b8b8b">Leaky two thirds: 50% every period</text>
<line x1="576" y1="100" x2="596" y2="100" stroke="#2f6f4e" stroke-width="2.1"/>
<text x="602" y="104" font-size="10.5" fill="#8b8b8b">The one cohort they make up</text>
<text x="576" y="150" font-size="10.5" fill="#8b8b8b">Neither segment's rate ever</text>
<text x="576" y="165" font-size="10.5" fill="#8b8b8b">moves. The cohort's rate</text>
<text x="576" y="180" font-size="10.5" fill="#8b8b8b">climbs from 63 to 89 percent</text>
<text x="576" y="195" font-size="10.5" fill="#8b8b8b">and keeps heading for 90,</text>
<text x="576" y="210" font-size="10.5" fill="#8b8b8b">because the leaky segment is</text>
<text x="576" y="225" font-size="10.5" fill="#8b8b8b">disappearing faster, so the</text>
<text x="576" y="240" font-size="10.5" fill="#8b8b8b">survivors are more and more</text>
<text x="576" y="255" font-size="10.5" fill="#8b8b8b">made of the sticky one.</text>
<text x="576" y="270" font-size="10.5" fill="#8b8b8b"></text>
<text x="576" y="285" font-size="10.5" fill="#8b8b8b">Nobody became more loyal.</text>
<text x="576" y="300" font-size="10.5" fill="#8b8b8b">The mix changed.</text>
<text x="64" y="440" font-size="11.5" fill="#8b8b8b">Computed from Fader and Hardie's published two-segment example (Marketing Science, 2010): one third of the</text>
<text x="64" y="456" font-size="11.5" fill="#8b8b8b">cohort retains at 90 percent every period, two thirds at 50 percent, and neither rate ever changes.</text>
</svg>
