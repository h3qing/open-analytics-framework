<text x="17" y="206" font-size="11.5" fill="#8b8b8b" text-anchor="middle" transform="rotate(-90 17 206)">Percent converted, everyone who ever signed up</text>
<path d="M64.0,193.0 L128.2,196.2 L192.5,209.6 L256.8,228.0 L321.0,246.4 L385.2,261.6 L449.5,272.9 L513.8,280.5 L578.0,285.4" fill="none" stroke="#b3452f" stroke-width="2.8" stroke-linejoin="round"/>
<circle cx="578.0" cy="285.4" r="3.4" fill="#b3452f"/>
<text x="592" y="74" font-size="10.5" fill="#8b8b8b">One number for the</text>
<text x="592" y="89" font-size="10.5" fill="#8b8b8b">whole customer base.</text>
<text x="592" y="119" font-size="10.5" fill="#8b8b8b">It falls every month,</text>
<text x="592" y="134" font-size="10.5" fill="#8b8b8b">from about 7.5% to</text>
<text x="592" y="149" font-size="10.5" fill="#8b8b8b">under 4%.</text>
<text x="592" y="179" font-size="10.5" fill="#8b8b8b">Every group in the</text>
<text x="592" y="194" font-size="10.5" fill="#8b8b8b">chart above is healthy.</text>
<text x="592" y="209" font-size="10.5" fill="#8b8b8b">Signups just grew, so</text>
<text x="592" y="224" font-size="10.5" fill="#8b8b8b">most of the base has</text>
<text x="592" y="239" font-size="10.5" fill="#8b8b8b">not had time yet.</text>
