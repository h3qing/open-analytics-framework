<text x="385.2" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">5</text>
<text x="449.5" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">6</text>
<text x="513.8" y="396" font-size="11" fill="#8b8b8b" text-anchor="middle">7</text>
