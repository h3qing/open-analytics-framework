<text x="55" y="87.1" font-size="11" fill="#8b8b8b" text-anchor="end">12%</text>
<line x1="64" y1="34.0" x2="578" y2="34.0" stroke="#8b8b8b" stroke-opacity="0.22"/>
<text x="55" y="38.0" font-size="11" fill="#8b8b8b" text-anchor="end">14%</text>
