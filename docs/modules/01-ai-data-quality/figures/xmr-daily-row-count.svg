<text x="188.8" y="213.2" font-size="11" fill="#3a7ca5">routine dip: the tight guess pages,</text>
<text x="188.8" y="227.2" font-size="11" fill="#3a7ca5">the limits stay quiet</text>
<text x="400.6" y="159.8" font-size="11" fill="#b3452f">real shift: outside the limits,</text>
<text x="400.6" y="173.8" font-size="11" fill="#b3452f">while the loose guess sleeps</text>
<text x="64" y="372" font-size="11.5" fill="#8b8b8b">Illustrative numbers. Limits are computed from days 1–20 by the arithmetic in the control plan: mean ± 2.66 × average moving range.</text>
<text x="64" y="388" font-size="11.5" fill="#8b8b8b">Wherever a guessed threshold lands, it pages on routine variation or sleeps through a real shift, and usually both over a quarter.</text>
